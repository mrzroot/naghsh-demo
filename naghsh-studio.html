<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naghsh Studio Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: product-led storefront (Stageshow rules). Bold type with one accent word, search up front, an animated faux shop window as hero, bento of small product scenes, catalogue, animated print-order scene + working quote. */
:root{
  --bg:#FFFFFF; --bg-2:#F5F5F3; --bg-3:#ECEBE7; --card:#FFFFFF; --ink:#0E0E10; --ink-2:#5E5E66; --ink-3:#9A9AA2;
  --line:#E6E5E1; --line-2:#D6D5D0; --bar:#E4E3DF; --bar-2:#EFEEEA; --red:#E5243B; --red-2:rgba(229,36,59,.10);
  --lapis:#1D2C4A; --gold:#C69A48; --ok:#16A34A; --win:#FFFFFF; --win-2:#FAFAF8; --shadow:0 30px 70px -30px rgba(14,14,16,.35),0 2px 6px rgba(14,14,16,.06);
  --f:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif; --f-acc:'Noto Naskh Arabic','Instrument Serif',serif; --f-lat:'Instrument Serif',Georgia,serif;
  --r:22px; --ease:cubic-bezier(.22,.8,.2,1);
}
:root[lang="en"]{ --f-acc:'Instrument Serif',Georgia,serif }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0C0E; --bg-2:#141417; --bg-3:#1B1B1F; --card:#141417; --ink:#F3F3F1; --ink-2:#A3A3AB; --ink-3:#6E6E76;
  --line:#26262B; --line-2:#34343A; --bar:#2A2A30; --bar-2:#212126; --red:#FF4258; --red-2:rgba(255,66,88,.14);
  --win:#17171A; --win-2:#1C1C20; --shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0C0E; --bg-2:#141417; --bg-3:#1B1B1F; --card:#141417; --ink:#F3F3F1; --ink-2:#A3A3AB; --ink-3:#6E6E76;
  --line:#26262B; --line-2:#34343A; --bar:#2A2A30; --bar-2:#212126; --red:#FF4258; --red-2:rgba(255,66,88,.14);
  --win:#17171A; --win-2:#1C1C20; --shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04); color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:850;text-wrap:balance}
:root[lang="en"] h1,:root[lang="en"] h2{letter-spacing:-.035em}
em.acc{font-family:var(--f-acc);font-style:normal;font-weight:700;color:var(--red);letter-spacing:0}
:root[lang="en"] em.acc{font-style:italic;font-weight:400}
p{margin:0} a{color:inherit;text-decoration:none} button,input,select{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:700;font-size:14.5px;transition:transform .2s var(--ease),background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ink:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn svg{width:16px;height:16px}
:root[dir="ltr"] .flip{transform:scaleX(-1)}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:var(--card)}
:root[dir="rtl"] .pill{padding:0 14px 0 6px}
.pill b{background:var(--red);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}

/* nav: floating pill */
.navbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;margin-top:12px}
.nav{display:flex;align-items:center;gap:6px;height:58px;padding:0 8px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;padding-inline:12px 6px;font-weight:900;letter-spacing:.24em;font-size:15px;direction:ltr}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand i svg{width:16px;height:16px}
.links{display:flex;gap:2px;margin-inline-start:auto}
.links a{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.links a:hover,.links a[aria-current]{color:var(--ink);background:var(--bg-2)}
.langbtn{height:38px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:700;font-size:12.5px;padding:0 10px}
.cartbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 16px;border-radius:999px;background:var(--ink);color:var(--bg);border:0;font-weight:700;font-size:13.5px}
:root[dir="rtl"] .cartbtn{padding:0 16px 0 6px}
.cartbtn .n{min-width:30px;height:30px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px}
[hidden]{display:none!important}
.links a.door{border:1px solid var(--red);color:var(--red);margin-inline-start:6px}
.links a.door:hover{background:var(--red);color:#fff}
@media (max-width:820px){ .links a:not(.door){display:none} .links a.door{font-size:12.5px;padding:7px 12px;margin:0} .cartbtn .t{display:none} .cartbtn{padding:0 6px!important} .nav>.sp{display:none} }
.doorband{border-radius:32px;background:var(--ink);color:var(--bg);padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.doorband h2{font-size:clamp(26px,3.6vw,42px)}
.doorband p{color:color-mix(in srgb,var(--bg) 62%,transparent);margin-top:10px;max-width:52ch}
.doorband .btn{background:var(--red);border-color:var(--red);color:#fff;height:54px;padding:0 28px}
.doorband ul{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.doorband li{border:1px solid color-mix(in srgb,var(--bg) 20%,transparent);border-radius:999px;padding:4px 12px;font-size:12.5px}
@media (max-width:720px){ .doorband{grid-template-columns:1fr} }
.backl{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink-2);margin-bottom:18px}
.backl:hover{color:var(--red)}
:root[dir="rtl"] .rflip{transform:scaleX(-1)}
.engr{position:absolute;top:0;inset-inline:0;height:230px;display:grid;place-items:center}
.engr svg{height:100%;width:auto}
.eng{position:absolute;top:96px;left:50%;translate:-50% 0;rotate:-38deg;font-family:var(--f-acc);font-size:19px;color:#F3DFA6;text-shadow:0 1px 0 rgba(0,0,0,.4);pointer-events:none}

/* hero */
.hero{padding-block:clamp(48px,7vw,88px) 0;text-align:center}
.hero .in{display:grid;justify-items:center;gap:22px}
.hero h1{font-size:clamp(40px,7vw,86px);max-width:15ch}
.hero .lede{font-size:clamp(15px,1.4vw,18px);color:var(--ink-2);max-width:52ch}
.search{display:flex;align-items:center;gap:8px;width:min(560px,100%);height:58px;padding:0 6px 0 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);box-shadow:0 12px 30px -20px rgba(0,0,0,.3)}
.search svg{width:20px;height:20px;color:var(--ink-3);margin-inline-start:14px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font-size:15px;height:100%}
.search input:focus{outline:none}
.search .btn{height:46px}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:13px;color:var(--ink-3)}
.quick button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink-2)}
.quick button:hover{border-color:var(--ink);color:var(--ink)}

/* ===== stage (faux product UI) ===== */
.stage-box{position:relative;width:100%;margin-inline:auto;overflow:hidden}
.stage{position:absolute;top:0;inset-inline-start:0;transform-origin:top right;--k:1}
:root[dir="ltr"] .stage{transform-origin:top left}
.fade-foot{-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.win{position:absolute;background:var(--win);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.chrome{height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--win-2);direction:ltr}
.chrome .dots{display:flex;gap:7px}
.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--bar)}
.chrome .url{flex:1;display:flex;justify-content:center}
.chrome .url span{height:24px;padding:0 14px;border-radius:7px;background:var(--bg-3);display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.chrome .url svg{width:10px;height:10px}
.bar{display:block;height:8px;border-radius:5px;background:var(--bar)}
.bar.s{height:6px;background:var(--bar-2)}
.ahead{height:54px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line)}
.ahead .lg{font-weight:900;letter-spacing:.24em;font-size:12.5px;direction:ltr}
.ahead .navb{display:flex;gap:14px;margin-inline-start:12px}
.ahead .cart{margin-inline-start:auto;position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.ahead .cart svg{width:16px;height:16px}
.ahead .cart b{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;overflow:hidden}
.abody{display:grid;grid-template-columns:168px 1fr;height:calc(100% - 94px)}
.aside{border-inline-end:1px solid var(--line);padding:18px 14px;display:grid;gap:6px;align-content:start}
.aside .it{height:34px;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px}
.aside .it.on{background:var(--bg-2);font-weight:700;font-size:12.5px}
.aside .it.on i{width:6px;height:6px;border-radius:50%;background:var(--red)}
.amain{padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start}
.tilep{display:grid;gap:8px;transition:transform .5s var(--ease)}
.tilep .ph{aspect-ratio:1/.86;border-radius:12px;background:color-mix(in srgb,var(--tint) 12%,var(--bg-2));display:grid;place-items:center;overflow:hidden;position:relative}
.tilep .ph svg{width:82%;height:82%}
.tilep .nm{font-size:12px;font-weight:700;line-height:1.4}
.tilep .pr{font-size:11.5px;color:var(--ink-2)}
.tilep.hover{transform:translateY(-4px)}
.tilep.hover .ph{box-shadow:0 14px 26px -16px rgba(0,0,0,.35)}
.addb{position:absolute;bottom:8px;inset-inline:8px;height:32px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s,transform .15s}
.tilep .ph .addb svg{width:12px;height:12px}
.addb .lab{align-items:center;gap:6px}
.addb.press{transform:scale(.94)}
.addb.done{background:var(--ok);color:#fff}
.addb .lab{display:inline-flex;transition:opacity .2s,transform .3s var(--ease)}
.sat{position:absolute;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.rcpt{padding:16px;display:grid;gap:10px}
.rcpt h4{margin:0;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.rcpt h4 span{font-size:11px;color:var(--ink-3);font-weight:600}
.rl{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.rl .th{width:40px;height:40px;border-radius:9px;background:color-mix(in srgb,var(--tint) 14%,var(--bg-2));display:grid;place-items:center;overflow:hidden}
.rl .th svg{width:92%;height:92%}
.rl b{font-size:11.5px;font-weight:700;line-height:1.35}
.rl .pr{font-size:11.5px;font-weight:700}
.coll{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease),opacity .4s;opacity:0}
.coll>div{overflow:hidden}
.coll.open{grid-template-rows:1fr;opacity:1}
.rtot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line-2);padding-top:10px;font-size:12px;color:var(--ink-2)}
.rtot b{font-size:16px;color:var(--ink);font-weight:900}
.payb{height:38px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s,transform .15s}
.payb.press{transform:scale(.95)} .payb.done{background:var(--ok)}
.payb svg{width:13px;height:13px}
.chipfly{position:absolute;width:44px;height:44px;border-radius:12px;background:var(--card);box-shadow:0 10px 24px -10px rgba(0,0,0,.4);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:5}
.chipfly svg{width:90%;height:90%}
.cursor{position:absolute;top:0;left:0;width:24px;height:24px;z-index:10;pointer-events:none;transition:transform 0s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.cursor svg{width:100%;height:100%;transition:transform .12s}
.cursor.down svg{transform:scale(.85)}
.toastw{position:absolute;bottom:20px;left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:700;display:flex;gap:7px;align-items:center;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .4s var(--ease);white-space:nowrap}
.toastw.on{opacity:1;transform:none}
.toastw svg{width:12px;height:12px;color:#4ADE80}
/* print scene */
.pform{display:grid;grid-template-columns:1.15fr .85fr;height:calc(100% - 94px)}
.pform .l{padding:22px;display:grid;gap:16px;align-content:start}
.lbl{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.dz{height:92px;border:1.5px dashed var(--line-2);border-radius:14px;display:grid;place-items:center;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
.dz.over{border-color:var(--red);background:var(--red-2)}
.dz .empty{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;transition:opacity .2s}
.dz .empty svg{width:18px;height:18px}
.frow{position:absolute;inset:12px;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;background:var(--bg-2);border-radius:10px;padding:0 12px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .4s var(--ease)}
.frow.on{opacity:1;transform:none}
.frow .fi{width:30px;height:36px;border-radius:5px;background:var(--red);color:#fff;font-size:8.5px;font-weight:800;display:grid;place-items:end center;padding-bottom:4px;direction:ltr}
.frow b{font-size:12px;display:block;line-height:1.3}
.frow small{font-size:10.5px;color:var(--ink-3)}
.prog{height:4px;border-radius:4px;background:var(--bar);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;width:0;background:var(--red);border-radius:inherit;transition:width 1.1s var(--ease)}
.frow .ok{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s var(--ease)}
.frow .ok.on{opacity:1;transform:none}
.frow .ok svg{width:12px;height:12px}
.segw{display:flex;gap:6px}
.segw span{height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:700;transition:background .25s,color .25s,border-color .25s}
.segw span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segw span.press{transform:scale(.95)}
.fld{height:38px;border:1px solid var(--line-2);border-radius:10px;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:13px;gap:2px}
.fld .caret{width:1.5px;height:16px;background:var(--red);animation:blink 1s steps(1) infinite;opacity:0}
.fld.typing .caret{opacity:1}
@keyframes blink{50%{visibility:hidden}}
.pform .r{background:var(--ink);color:var(--bg);padding:22px;display:grid;gap:10px;align-content:start}
.pform .r .lbl{color:color-mix(in srgb,var(--bg) 55%,transparent)}
.srw{display:flex;justify-content:space-between;font-size:11.5px;padding-block:7px;border-bottom:1px solid color-mix(in srgb,var(--bg) 12%,transparent)}
.srw span{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.big{font-size:28px;font-weight:900;line-height:1.2;margin-top:6px}
.hintp{font-size:11px;background:color-mix(in srgb,var(--red) 24%,transparent);border-radius:9px;padding:8px 10px;line-height:1.6;opacity:0;transition:opacity .4s}
.hintp.on{opacity:1}
.subb{height:38px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s,transform .15s;margin-top:4px}
.subb.press{transform:scale(.95)} .subb.done{background:var(--ok)}
.subb svg{width:13px;height:13px}
.fileflt{position:absolute;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px 8px 8px;box-shadow:0 16px 30px -14px rgba(0,0,0,.45);font-size:11.5px;font-weight:700;z-index:6;transition:opacity .25s}
.fileflt .fi{width:24px;height:30px;border-radius:4px;background:var(--red);color:#fff;font-size:7.5px;font-weight:800;display:grid;place-items:end center;padding-bottom:3px;direction:ltr}
.notif{position:absolute;padding:12px 14px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border-radius:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);opacity:0;transform:translateY(-14px) scale(.97);transition:opacity .4s,transform .55s var(--ease)}
.notif.on{opacity:1;transform:none}
.notif .ap{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.notif .ap svg{width:18px;height:18px}
.notif b{font-size:12px;display:flex;justify-content:space-between;gap:8px}
.notif b small{font-weight:500;color:var(--ink-3);font-size:10.5px}
.notif p{font-size:11.5px;color:var(--ink-2);line-height:1.5}

/* sections */
.sec{padding-block:clamp(64px,9vw,120px)}
.head{display:grid;gap:12px;margin-bottom:clamp(28px,4vw,48px);max-width:640px}
.head.c{text-align:center;justify-items:center;margin-inline:auto}
.head h2{font-size:clamp(30px,4.4vw,54px)}
.head p{color:var(--ink-2)}
.tag{font-size:12.5px;font-weight:700;color:var(--red)}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(320px,auto);gap:14px}
.bt{position:relative;border-radius:var(--r);background:var(--bg-2);overflow:hidden;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;min-height:320px;isolation:isolate}
.bt h3{font-size:19px;font-weight:800}
.bt p{font-size:13.5px;color:var(--ink-2);margin-top:4px;max-width:30ch}
.bt .scene{position:absolute;inset:0;z-index:-1}
.b1{grid-column:span 3;grid-row:span 2;background:var(--lapis);color:#F4EEDF}
.b1 p{color:#B9B3A2}
.b2{grid-column:span 3}
.b3,.b4,.b5{grid-column:span 3}
.b4,.b5{grid-column:span 3}
@media (min-width:1100px){ .b1{grid-column:span 2} .b2,.b3{grid-column:span 4} .b4,.b5{grid-column:span 3} }
@media (max-width:900px){ .bento{grid-template-columns:1fr 1fr} .b1{grid-column:span 2;grid-row:auto;min-height:420px} .b2{grid-column:span 2} .b3,.b4,.b5{grid-column:span 1} .b5{grid-column:span 2} }

  const chrome=`<div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url"><span>${S('url')}/print</span></span><span style="width:47px"></span></div>`;
  const head=`<div class="ahead"><span class="lg">NAGHSH</span><span class="navb"><span class="bar" style="width:44px"></span><span class="bar" style="width:56px"></span></span><span class="cart">${IC.bag}</span></div>`;
  if(compact) return `<div class="win" style="top:110px;inset-inline-start:14px;width:362px;height:600px">${chrome}<div style="padding:16px;display:grid;gap:14px">${dz}${sides}</div><div class="pform" style="display:block;height:auto">${right}</div></div>${notif}${file}`;
  return `<div class="win" style="top:40px;inset-inline-start:110px;width:820px;height:540px">${chrome}${head}<div class="pform"><div class="l">${dz}<div><div class="lbl" style="margin-bottom:6px">${S('type')}</div><div class="segw"><span class="on">${t('t_bw')}</span><span>${t('t_color')}</span><span>${t('t_glossy')}</span></div></div>${sides}<div><div class="lbl" style="margin-bottom:6px">${S('pages')}</div><div class="fld num" data-t="fld"><span data-t="fv"></span><span class="caret"></span></div></div></div>${right}</div></div>${notif}${file}`;
}
async function scriptPrint(a,poster){
  const q=a.q, file=q('[data-t=file]'), sub=q('[data-t=submit]'), slab=$('.lab',sub);
  const setSub=d=>{sub.classList.toggle('done',d);slab.innerHTML=d?`${IC.check}<span>${S('ok')}</span>`:`<span>${S('submit')}</span>`};
  const setSides=d=>{q('[data-t=single]').classList.toggle('on',!d);q('[data-t=duplex]').classList.toggle('on',d)};
  const fv=q('[data-t=fv]');
  const reset=()=>{setSub(false);setSides(false);q('[data-t=frow]').classList.remove('on');q('[data-t=prog]').style.width='0';q('[data-t=ok]').classList.remove('on');$('.empty',q('[data-t=dz]')).style.opacity=1;q('[data-t=tot]').textContent=nf(0);q('[data-t=pg]').textContent='—';q('[data-t=unit]').textContent='—';q('[data-t=hint]').classList.remove('on');q('[data-t=notif]').classList.remove('on');if(fv) fv.textContent='';file.style.opacity=1};
  const filled=()=>{q('[data-t=frow]').classList.add('on');q('[data-t=prog]').style.width='100%';q('[data-t=ok]').classList.add('on');$('.empty',q('[data-t=dz]')).style.opacity=0;q('[data-t=pg]').textContent=nf(240);q('[data-t=unit]').textContent=nf(1500);if(fv) fv.textContent=nf(240)};
  const home=a.compact?[30,40]:[40,a.size.h-90];
  const placeFile=(x,y,tr)=>{file.style.transition=tr?'transform .9s cubic-bezier(.45,.05,.25,1),opacity .25s':'none';file.style.left=file.style.top='0';file.style.transform=`translate(${x}px,${y}px) rotate(${tr?0:-6}deg)`};
  if(poster){reset();filled();setSides(true);q('[data-t=tot]').textContent=nf(324000);q('[data-t=hint]').classList.add('on');setSub(true);q('[data-t=notif]').classList.add('on');file.style.opacity=0;return}
  reset(); placeFile(...home,false); a.park(a.size.w*.5,a.size.h+30);
  await a.wait(600);
  await a.move([home[0]+30,home[1]+20],800);
  // drag the file onto the drop zone
  const [dx,dy]=a.pos('[data-t=dz]'); q('[data-t=dz]').classList.add('over');
  placeFile(dx-60,dy-18,true); a.q('.cursor').style.transition='transform .9s cubic-bezier(.45,.05,.25,1)'; a.q('.cursor').style.transform=`translate(${dx-30}px,${dy+2}px)`;
  await a.wait(950); file.style.opacity=0; q('[data-t=dz]').classList.remove('over');
  q('[data-t=frow]').classList.add('on'); $('.empty',q('[data-t=dz]')).style.opacity=0; await a.wait(60); q('[data-t=prog]').style.width='100%';
  await a.wait(1150); q('[data-t=ok]').classList.add('on');
  // pages come from the file; the summary fills and the total rolls
  if(fv){const f=q('[data-t=fld]');f.classList.add('typing');for(const ch of [2,24,240]){fv.textContent=nf(ch);await a.wait(140)}f.classList.remove('typing')}
  q('[data-t=pg]').textContent=nf(240); q('[data-t=unit]').textContent=nf(1500);
  await roll(q('[data-t=tot]'),0,360000,900); q('[data-t=hint]').classList.add('on');
  await a.wait(700);
  await a.move('[data-t=duplex]',800); await a.click('[data-t=duplex]'); setSides(true);
  await roll(q('[data-t=tot]'),360000,324000,600);
  await a.wait(500);
  await a.move('[data-t=submit]',800,.5,.55); await a.click('[data-t=submit]'); setSub(true);
  await a.wait(700); q('[data-t=notif]').classList.add('on');
  await a.wait(3400);
  const st=a.q('.win').parentElement; st.style.transition='opacity .4s'; st.style.opacity=0; await a.wait(420); reset(); placeFile(...home,false); a.park(a.size.w*.5,a.size.h+30); st.style.opacity=1; await a.wait(300);
}

/* routing: the boutique is the entry; print services are a separate view behind #print */
let view='shop';
function route(){
  const h=location.hash.slice(1), target=h&&h!=='home'&&document.getElementById(h);
  const next=target&&target.closest('[data-view="print"]')?'print':(target&&!target.closest('[data-view]')&&h!=='top'?view:'shop');
  const changed=next!==view; view=next;
  $$('[data-view]').forEach(v=>v.hidden=v.dataset.view!==view);
  $$('[data-for]').forEach(e=>e.hidden=e.dataset.for!==view);
  (view==='print'?st2:st1).layout(); // a stage inside a view that was hidden had no width to build at
  if(h==='home'||h==='print'&&changed||!target) window.scrollTo({top:0,behavior:'auto'});
  else requestAnimationFrame(()=>target.scrollIntoView({behavior:changed?'auto':'smooth'}));
}
addEventListener('hashchange',route);
applyLang(); route();
